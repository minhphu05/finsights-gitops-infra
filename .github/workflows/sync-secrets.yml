name: Sync Cluster Secrets to K3s

on:
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync all secrets to K3s'
        required: false
        default: 'true'
        type: boolean
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-secrets.yml'

jobs:
  sync-secrets:
    name: Sync Repository Secrets to K3s Namespaces
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Open SSH Tunnel to K3s API
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -n "${SSH_PRIVATE_KEY}" ]; then
            echo "Setting up secure SSH Tunnel to VPS Node 1 (port 26567)..."
            mkdir -p ~/.ssh
            echo "${SSH_PRIVATE_KEY}" > ~/.ssh/finsights_vps
            chmod 600 ~/.ssh/finsights_vps
            ssh -i ~/.ssh/finsights_vps -o StrictHostKeyChecking=no -p 26567 -N -f -L 6443:127.0.0.1:6443 root@103.249.117.232
            sleep 2
            echo "✅ SSH Tunnel established: localhost:6443 -> VPS:6443"
          else
            echo "ℹ️ SSH_PRIVATE_KEY not provided, using direct connection from kubeconfig."
          fi

      - name: Configure Kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -z "${KUBECONFIG_DATA}" ]; then
            echo "❌ Error: Secret KUBECONFIG is not set in GitHub repository secrets!"
            exit 1
          fi
          mkdir -p ~/.kube
          echo "${KUBECONFIG_DATA}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify Cluster Connectivity
        run: |
          echo "Testing connection to K3s cluster..."
          kubectl cluster-info
          kubectl get nodes -o wide

      - name: Ensure Target Namespaces Exist
        run: |
          echo "Ensuring required namespaces exist..."
          kubectl create namespace finsights-platform --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace orchestration --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync Redis Credentials (finsights-platform)
        env:
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          if [ -n "${REDIS_PASSWORD}" ]; then
            echo "🔑 Syncing secret: redis-credentials in finsights-platform..."
            kubectl create secret generic redis-credentials \
              --namespace finsights-platform \
              --from-literal=redis-password="${REDIS_PASSWORD}" \
              --dry-run=client -o yaml | kubectl apply -f -
            echo "✅ redis-credentials synced successfully!"
          else
            echo "⚠️ Warning: REDIS_PASSWORD secret is not set in GitHub Secrets. Skipping."
          fi

      - name: Sync PostgreSQL Credentials (finsights-platform)
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          if [ -n "${POSTGRES_PASSWORD}" ]; then
            echo "🔑 Syncing secret: postgresql-credentials in finsights-platform..."
            kubectl create secret generic postgresql-credentials \
              --namespace finsights-platform \
              --from-literal=postgres-password="${POSTGRES_PASSWORD}" \
              --dry-run=client -o yaml | kubectl apply -f -
            echo "✅ postgresql-credentials synced successfully!"
          else
            echo "⚠️ Warning: POSTGRES_PASSWORD secret is not set in GitHub Secrets. Skipping."
          fi

      - name: Sync RabbitMQ Credentials (finsights-platform)
        env:
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          RABBITMQ_ERLANG_COOKIE: ${{ secrets.RABBITMQ_ERLANG_COOKIE }}
        run: |
          RABBIT_PASS="${RABBITMQ_PASSWORD:-FinsightsRabbitMQ2026!}"
          ERLANG_COOKIE="${RABBITMQ_ERLANG_COOKIE:-FinsightsErlangCookie2026!}"
          echo "🔑 Syncing secret: rabbitmq-credentials in finsights-platform..."
          kubectl create secret generic rabbitmq-credentials \
            --namespace finsights-platform \
            --from-literal=rabbitmq-password="${RABBIT_PASS}" \
            --from-literal=rabbitmq-erlang-cookie="${ERLANG_COOKIE}" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "✅ rabbitmq-credentials synced successfully!"

      - name: Sync Dagster PostgreSQL Credentials (orchestration)
        env:
          DAGSTER_POSTGRES_PASSWORD: ${{ secrets.DAGSTER_POSTGRES_PASSWORD || secrets.POSTGRES_PASSWORD }}
        run: |
          if [ -n "${DAGSTER_POSTGRES_PASSWORD}" ]; then
            echo "🔑 Syncing secret: dagster-postgresql-secret in orchestration..."
            kubectl create secret generic dagster-postgresql-secret \
              --namespace orchestration \
              --from-literal=postgresql-password="${DAGSTER_POSTGRES_PASSWORD}" \
              --dry-run=client -o yaml | kubectl apply -f -
            echo "✅ dagster-postgresql-secret synced successfully!"
          else
            echo "⚠️ Warning: DAGSTER_POSTGRES_PASSWORD is not set. Skipping."
          fi

      - name: Sync External Pipeline Credentials (orchestration)
        env:
          ORACLE_MYSQL_BACKEND_PASSWORD: ${{ secrets.ORACLE_MYSQL_BACKEND_PASSWORD }}
          ORACLE_MYSQL_AI_PASSWORD: ${{ secrets.ORACLE_MYSQL_AI_PASSWORD }}
          MYSQL_SCRAPING_APP_PASSWORD: ${{ secrets.MYSQL_SCRAPING_APP_PASSWORD }}
          MYSQL_NEWS_APP_PASSWORD: ${{ secrets.MYSQL_NEWS_APP_PASSWORD }}
          MYSQL_MARKET_APP_PASSWORD: ${{ secrets.MYSQL_MARKET_APP_PASSWORD }}
          ORACLE_ADB_PASSWORD: ${{ secrets.ORACLE_ADB_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          echo "🔑 Syncing secret: dagster-pipeline-secrets in orchestration..."
          kubectl create secret generic dagster-pipeline-secrets \
            --namespace orchestration \
            --from-literal=ORACLE_MYSQL_BACKEND_PASSWORD="${ORACLE_MYSQL_BACKEND_PASSWORD}" \
            --from-literal=ORACLE_MYSQL_AI_PASSWORD="${ORACLE_MYSQL_AI_PASSWORD}" \
            --from-literal=MYSQL_SCRAPING_APP_PASSWORD="${MYSQL_SCRAPING_APP_PASSWORD}" \
            --from-literal=MYSQL_NEWS_APP_PASSWORD="${MYSQL_NEWS_APP_PASSWORD}" \
            --from-literal=MYSQL_MARKET_APP_PASSWORD="${MYSQL_MARKET_APP_PASSWORD}" \
            --from-literal=ORACLE_ADB_PASSWORD="${ORACLE_ADB_PASSWORD}" \
            --from-literal=REDIS_PASSWORD="${REDIS_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "✅ dagster-pipeline-secrets synced successfully!"

      - name: Sync OCI Object Storage Credentials (orchestration & finsights-platform)
        env:
          OCI_TOKYO_S3_ACCESS_KEY_ID: ${{ secrets.OCI_TOKYO_S3_ACCESS_KEY_ID }}
          OCI_TOKYO_S3_SECRET_ACCESS_KEY: ${{ secrets.OCI_TOKYO_S3_SECRET_ACCESS_KEY }}
          OCI_SINGAPORE_S3_ACCESS_KEY_ID: ${{ secrets.OCI_SINGAPORE_S3_ACCESS_KEY_ID }}
          OCI_SINGAPORE_S3_SECRET_ACCESS_KEY: ${{ secrets.OCI_SINGAPORE_S3_SECRET_ACCESS_KEY }}
        run: |
          echo "🔑 Syncing secret: oci-object-storage-credentials in orchestration & finsights-platform..."
          for ns in orchestration finsights-platform; do
            kubectl create secret generic oci-object-storage-credentials \
              --namespace "${ns}" \
              --from-literal=OCI_TOKYO_S3_ENDPOINT_URL="https://nryqf437jjy5.compat.objectstorage.ap-tokyo-1.oraclecloud.com" \
              --from-literal=OCI_TOKYO_S3_REGION="ap-tokyo-1" \
              --from-literal=OCI_TOKYO_S3_BUCKET_NAME="finsights-data-assets-tokyo" \
              --from-literal=OCI_TOKYO_S3_ACCESS_KEY_ID="${OCI_TOKYO_S3_ACCESS_KEY_ID}" \
              --from-literal=OCI_TOKYO_S3_SECRET_ACCESS_KEY="${OCI_TOKYO_S3_SECRET_ACCESS_KEY}" \
              --from-literal=OCI_SINGAPORE_S3_ENDPOINT_URL="https://axrxyxi3tkjc.compat.objectstorage.ap-singapore-1.oraclecloud.com" \
              --from-literal=OCI_SINGAPORE_S3_REGION="ap-singapore-1" \
              --from-literal=OCI_SINGAPORE_S3_BUCKET_NAME="finsights-data-assets-singapore" \
              --from-literal=OCI_SINGAPORE_S3_ACCESS_KEY_ID="${OCI_SINGAPORE_S3_ACCESS_KEY_ID}" \
              --from-literal=OCI_SINGAPORE_S3_SECRET_ACCESS_KEY="${OCI_SINGAPORE_S3_SECRET_ACCESS_KEY}" \
              --dry-run=client -o yaml | kubectl apply -f -
          done
          echo "✅ oci-object-storage-credentials synced successfully to orchestration and finsights-platform!"

      - name: Verify Synced Secrets in Cluster
        run: |
          echo "=========================================================="
          echo "📋 Synced Secrets Status:"
          echo "=========================================================="
          echo "Namespace: finsights-platform"
          kubectl get secrets -n finsights-platform
          echo ""
          echo "Namespace: orchestration"
          kubectl get secrets -n orchestration
          echo "=========================================================="
          echo "🎉 All secrets have been securely synchronized to K3s!"
