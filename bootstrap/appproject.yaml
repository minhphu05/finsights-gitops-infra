apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: finsights-infra
  namespace: argocd
spec:
  description: Finsights Infrastructure & Cluster Add-ons Project
  sourceRepos:
    - '*'
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: finsights-platform
  namespace: argocd
spec:
  description: Finsights Application Platform & Databases Project
  sourceRepos:
    - '*'
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
