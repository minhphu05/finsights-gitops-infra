# ==============================================================================
# ArgoCD Git Credentials Template
# Cấu hình Secret để ArgoCD xác thực và kéo mã nguồn từ Private Repositories
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: git-creds-gitops-infra
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://github.com/minhphu05/finsights-gitops-infra.git
  # Điền Personal Access Token hoặc Deploy Token của GitHub/GitLab
  password: "<YOUR_GITHUB_OR_GITLAB_PAT_TOKEN>"
  username: "git"
---
apiVersion: v1
kind: Secret
metadata:
  name: git-creds-platform-deployment
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://github.com/minhphu05/finsights-platform-deployment.git
  password: "<YOUR_GITHUB_OR_GITLAB_PAT_TOKEN>"
  username: "git"
