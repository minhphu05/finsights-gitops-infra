apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: finsights-infra
  namespace: argocd
spec:
  description: Finsights Infrastructure & Cluster Add-ons (Ingress, Cert-Manager, Headlamp)
  sourceRepos:
    - '*'
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: finsights-platform
  namespace: argocd
spec:
  description: Finsights Platform Applications, Orchestration & Pipelines (Redis, Dagster, APIs, Microservices)
  sourceRepos:
    - '*'
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
