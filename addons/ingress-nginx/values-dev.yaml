# ==============================================================================
# Finsights Ingress-Nginx Controller Configuration
# Environment: Dev / Production K3s (2 VPS Nodes)
# ==============================================================================

controller:
  kind: DaemonSet
  
  # Bind directly to host ports 80 and 443 on VPS nodes for direct browser access
  hostPort:
    enabled: true
    ports:
      http: 80
      https: 443

  ingressClassResource:
    name: nginx
    enabled: true
    default: true
    controllerValue: "k8s.io/ingress-nginx"

  service:
    enabled: true
    type: NodePort
    nodePorts:
      http: 30080
      https: 30443

  # Disable admission webhooks during initial bootstrap to prevent dependency deadlocks
  admissionWebhooks:
    enabled: false

  allowSnippetAnnotations: true

  # Resource limits tailored for VPS nodes
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  metrics:
    enabled: false
